<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copies &amp; Corrigés — annales et corrigés du secondaire camerounais</title>
    <meta name="description" content="Épreuves et corrigés du secondaire camerounais (BEPC, Probatoire, BAC) : annales par matière et par année, assistant IA, examens blancs, lecture hors-ligne." />
    <meta name="theme-color" content="#1b2a4a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Copies &amp; Corrigés" />
    <meta property="og:title" content="Copies &amp; Corrigés — annales et corrigés du secondaire camerounais" />
    <meta property="og:description" content="Annales corrigées du BEPC, Probatoire et BAC. Révise sur ton téléphone, même sans connexion." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Peinture AVANT l'arrivée du CSS de l'application : le rechargement
         (changement de langue, mise à jour du service worker) n'affiche plus
         un écran blanc, mais le fond habituel. */
      html {
        background-color: #f6f2e7;
      }
      html.dark {
        background-color: #0f1626;
      }
      /* Repère de démarrage : il disparaît dès que React monte dans #root. */
      #root:empty::after {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border: 3px solid rgba(27, 42, 74, 0.2);
        border-top-color: #1b2a4a;
        border-radius: 50%;
        animation: demarrage 0.8s linear infinite;
      }
      html.dark #root:empty::after {
        border-color: rgba(246, 242, 231, 0.2);
        border-top-color: #f6f2e7;
      }
      @keyframes demarrage {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
