name: Sauvegarde hebdomadaire
# Déclenche l'export habituel de l'application (vers le stockage objet configuré,
# Tigris en production) — Render gratuit n'a pas de cron. Secrets requis :
#   CRON_TOKEN (= variable CRON_TOKEN de Render) ; variable APP_URL facultative.
on:
  schedule:
    - cron: "30 3 * * 0"   # dimanche 03:30 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le serveur
        run: curl --fail --silent --retry 5 --retry-delay 30 --max-time 120 "${{ vars.APP_URL || 'https://bacprep-web-562v.onrender.com' }}/api/health"
      - name: Lancer l'export
        run: |
          curl --fail --silent --show-error --max-time 120 -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_TOKEN }}" \
            "${{ vars.APP_URL || 'https://bacprep-web-562v.onrender.com' }}/api/cron/backup"
