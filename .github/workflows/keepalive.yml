name: Keep-alive
# Appelle /api/health (SELECT 1 en base) chaque jour : l'activité évite la mise
# en pause du projet Supabase gratuit (inactif 1 semaine) et réveille Render.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --max-time 120 "${{ vars.APP_URL || 'https://bacprep-web-562v.onrender.com' }}/api/health"
