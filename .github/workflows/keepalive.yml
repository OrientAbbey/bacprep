name: Keep-alive
# Appelle /api/health (SELECT 1 en base) chaque jour : l'activité évite la mise
# en pause du projet Supabase gratuit (inactif 1 semaine). Render est maintenu
# éveillé séparément par UptimeRobot (ping /api/health/live toutes les 5 min) :
# son plan Free se met en pause après ~15 min sans requête.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --max-time 120 "${{ vars.APP_URL || 'https://bacprep-web-562v.onrender.com' }}/api/health"
