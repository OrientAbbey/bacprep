name: CI
on:
  push:
    branches: [main, refonte]
  pull_request:
env:
  FILE_URL_SECRET: ci-secret-ci-secret-ci-secret-ci-0
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bacprep, POSTGRES_PASSWORD: bacprep, POSTGRES_DB: bacprep_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bacprep" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ matrix.base == 'postgres' && 'postgresql+psycopg://bacprep:bacprep@127.0.0.1/bacprep_test?sslmode=disable' || '' }}
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
  e2e:
    # Navigateur réel (Chromium) sur le serveur complet + PostgreSQL.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bacprep, POSTGRES_PASSWORD: bacprep, POSTGRES_DB: bacprep_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bacprep" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Démarrer le serveur
        working-directory: backend
        env:
          ENV: dev
          AUTH_MODE: mock
          DEMO_MODE: "true"
          DATABASE_URL: postgresql+psycopg://bacprep:bacprep@127.0.0.1/bacprep_e2e
          DB_SSLMODE: disable
          ADMIN_TOKEN: e2e-admin-token
          STORAGE_BACKEND: local
          ASSISTANT_RATE_LIMIT: "0"
          LOGIN_RATE_LIMIT: "0"
        run: |
          nohup uvicorn app.main:app --port 8765 > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8765/api/health && break || sleep 2; done
      - run: npm run e2e
        working-directory: frontend
        env: { E2E_URL: "http://localhost:8765", E2E_ADMIN_TOKEN: e2e-admin-token }
      - if: failure()
        run: tail -50 server.log
