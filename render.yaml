services:
  # Backend FastAPI (process persistant : WebSocket de kick-out, tâches
  # de fond d'import massif). Les fichiers d'épreuves vivent dans un
  # stockage objet S3-compatible (STORAGE_BACKEND=s3) — le disque éphémère
  # du service n'héberge plus de données persistantes.
  - type: web
    name: bacprep-web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5" # version épinglée (le défaut 3.14 peut casser des wheels)
      - key: ENV
        value: prod # cookie Secure, refus du jeton admin d'exemple
      # Supabase : utiliser l'URL du POOLER Supavisor (port 6543, IPv4),
      # PAS la connexion directe db.<ref>.supabase.co:5432 (IPv6-only, non
      # routable depuis Render). Ex. :
      # postgresql://postgres.<project_ref>:<mdp>@aws-0-<region>.pooler.supabase.com:6543/postgres
      # Le sslmode=require est ajouté automatiquement par backend/app/db.py.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require # ajouté automatiquement si absent, mais explicite vaut mieux
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MAX_OVERFLOW
        value: "10"
      # Docs API (/docs, /redoc, /openapi.json) : en prod, servies à ce
      # chemin secret unique ; vide ou absent = docs désactivées.
      - key: DOCS_PATH
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      # Stockage objet S3-compatible — voir DEPLOIEMENT.md pour chaque
      # fournisseur :
      # - Tigris Data (défaut) : endpoint https://fly.storage.tigris.dev, région auto
      # - Supabase Storage     : endpoint https://<ref>.supabase.co/storage/v1/s3, région du projet
      # - Backblaze B2         : endpoint https://s3.<region>.backblazeb2.com, région du bucket
      # Le bucket (privé) doit exister avant le premier démarrage.
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_SIGNED_URL_EXPIRY
        value: "900" # URLs signées valables 15 min
      - key: ADMIN_TOKEN
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true # clé HMAC des URLs signées de fichiers
      - key: ADMIN_EMAILS
        sync: false # whitelist réelle des emails admin (ex. admin@votre-domaine.cm)
      - key: AUTH_MODE
        value: google # authentification Google vérifiée ; "mock" réservé au dev/démo local
      - key: GOOGLE_CLIENT_ID
        sync: false # requis (Client ID Google Cloud Console)
      - key: DEMO_MODE
        value: "false" # paywall réel : checkout exige un paiement agrégateur, pas de webhook simulé
      - key: ADMIN_SESSION_TIMEOUT_MINUTES
        value: "3" # délai avant expiration du verrou admin après quitter /admin
      - key: GEMINI_API_KEY
        sync: false
      # Modèles GRATUITS, fallback ordonné : essai dans l'ordre de la liste
      # (échec → modèle suivant → Groq → mode démo). Autres modèles gratuits
      # dans backend/.env.example.
      - key: GEMINI_MODELS
        value: "gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: "openai/gpt-oss-20b,qwen/qwen3.6-27b,openai/gpt-oss-120b,qwen/qwen3.8-27b"
      - key: LLM_CONCURRENCY_LIMIT
        value: "5"
      - key: CORS_ORIGINS
        # Helm oublié : Render réattribue un suffixe aléatoire au nom d'hôte
        # (plan gratuit) — le regex https://*.onrender.com côté backend couvre
        # tous les cas ; cette liste reste explicite par référence.
        value: https://bacprep-frontend-hpad.onrender.com

  # Frontend React/Vite déployé comme site statique — communique avec le
  # backend via HTTPS (architecture technique).
  - type: web
    name: bacprep-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bacprep-web.onrender.com
    routes:
      # SPA : toute route inconnue renvoie index.html (navigation client).
      - type: rewrite
        source: /*
        destination: /index.html
